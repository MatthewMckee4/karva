name: Set up uv Python
description: Install uv-managed Python and expose its interpreter and shared library to native builds.
inputs:
  python-version:
    description: Python version or uv interpreter request, including architecture when cross-compiling.
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.13.0"
        python-version: ${{ inputs.python-version }}
    - name: Install Python
      shell: bash
      env:
        PYTHON_REQUEST: ${{ inputs.python-version }}
      run: |
        uv python install "$PYTHON_REQUEST"
        uv run --no-project --python "$PYTHON_REQUEST" python - <<'PY'
        import os
        import pathlib
        import sys
        import sysconfig

        with open(os.environ["GITHUB_ENV"], "a") as env:
            print(f"PYO3_PYTHON={sys.executable}", file=env)
            if sys.platform != "win32":
                variable = "DYLD_FALLBACK_LIBRARY_PATH" if sys.platform == "darwin" else "LD_LIBRARY_PATH"
                libdir = sysconfig.get_config_var("LIBDIR")
                previous = os.environ.get(variable, "")
                print(f"{variable}={libdir}" + (f":{previous}" if previous else ""), file=env)
        with open(os.environ["GITHUB_PATH"], "a") as path:
            print(pathlib.Path(sys.executable).parent, file=path)
        PY
