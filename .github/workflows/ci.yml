name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=astral-sh/hawk
  HAWK_VERSION: 0.1.12
  # Keep this exact version preinstalled before nextest starts.
  PYTHON_VERSION: "3.14.4"
  RUSTUP_MAX_RETRIES: 10
  NEXTEST_PROFILE: ci

jobs:
  determine_changes:
    name: "determine changes"

    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # Flag that is raised when any code is changed
      code: ${{ steps.check_code.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine merge base
        id: merge_base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          sha=$(git merge-base HEAD "origin/${BASE_REF}")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check if there was any code related change
        id: check_code
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            . \
            ':!.gitattributes' \
            ':!.github/CODEOWNERS' \
            ':!.github/CODE_OF_CONDUCT.md' \
            ':!.github/FUNDING.yml' \
            ':!.github/ISSUE_TEMPLATE/**' \
            ':!.github/PULL_REQUEST_TEMPLATE.md' \
            ':!.github/actionlint.yaml' \
            ':!.github/renovate.json5' \
            ':!.github/zizmor.yml' \
            ':!docs/' \
            ':!.markdownlint.yaml' \
            ':!.pre-commit-config.yaml' \
            ':!AGENTS.md' \
            ':!CHANGELOG.md' \
            ':!CODE_OF_CONDUCT.md' \
            ':!CONTRIBUTING.md' \
            ':!justfile' \
            ':!LICENSE' \
            ':!README.md' \
            ':!SECURITY.md' \
            ':!STYLE.md' \
            ':!seal.toml' \
            ':!zensical.toml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: "pre commit"

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6

  cargo-fmt:
    name: "cargo fmt"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup component add rustfmt

      - name: "Check Rust formatting"
        run: cargo fmt --all --check

  cargo-clippy:
    name: "cargo clippy"

    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust toolchain"
        run: rustup component add clippy

      - name: "Lint Rust"
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  zed-extension:
    name: "Zed extension"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: editors/zed

      - name: "Install Rust toolchain"
        run: rustup component add clippy rustfmt

      - name: "Install WebAssembly target"
        run: rustup target add wasm32-wasip2

      - name: "Check Zed extension"
        run: |
          cargo fmt --manifest-path editors/zed/Cargo.toml --all --check
          cargo test --manifest-path editors/zed/Cargo.toml --locked
          cargo clippy --manifest-path editors/zed/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path editors/zed/Cargo.toml --locked --target wasm32-wasip2

  cargo-hawk:
    name: "cargo hawk"

    runs-on: ubuntu-latest
    # Cold local check completed in 28 seconds; 10 minutes leaves CI headroom.
    timeout-minutes: 10

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Hawk"
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      - name: "Check public Rust APIs"
        run: cargo hawk check -D warnings -D hawk::unnecessary_crate_visibility

  cargo-shear:
    name: "cargo shear"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install cargo shear"
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-shear@1.12.4

      - name: "Check unused dependencies"
        run: cargo shear --deny-warnings

  cargo-test:
    name: "cargo test (${{ matrix.os }})"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-nextest

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"

      - name: "Install integration test Python"
        run: uv python install "$PYTHON_VERSION"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.10"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build

      - name: Run tests
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          KARVA_MAX_PARALLELISM: 2
        run: |
          cargo nextest run --profile ci

  wheel-smoke:
    name: "wheel smoke"

    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build

      - name: Run wheel smoke project
        working-directory: crates/karva/tests/projects/wheel-smoke
        run: |
          uv venv --python 3.10 .venv
          uv pip install --python .venv/bin/python ../../../../../target/wheels/karva-*.whl
          uv run --no-sync karva test --no-parallel --status-level=skip --final-status-level=skip

  build-windows-tests:
    name: "build tests archive | windows"

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-nextest

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build

      - name: "Archive tests"
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      - name: "Upload test archive"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-nextest-archive
          path: nextest-archive.tar.zst

      - name: "Upload wheel"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-karva-wheel
          path: target/wheels/*.whl

  cargo-test-windows:
    name: "cargo test (windows ${{ matrix.partition }}/5)"

    needs: build-windows-tests

    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-nextest

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.10"

      - name: "Download test archive"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-nextest-archive

      - name: "Download wheel"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-karva-wheel
          path: target/wheels

      - name: Run tests
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          KARVA_MAX_PARALLELISM: 2
        run: |
          cargo nextest run --profile ci --archive-file nextest-archive.tar.zst --partition hash:${{ matrix.partition }}/5

  build-docs:
    name: "Build docs"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build docs
        run: uv run --isolated --only-group docs zensical build

  ci-gate:
    name: "CI gate"

    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - determine_changes
      - pre-commit
      - cargo-fmt
      - cargo-clippy
      - cargo-shear
      - cargo-test
      - wheel-smoke
      - build-windows-tests
      - cargo-test-windows
      - build-docs
    if: ${{ always() }}

    steps:
      - name: Require successful validation
        env:
          BUILD_DOCS_RESULT: ${{ needs.build-docs.result }}
          BUILD_WINDOWS_TESTS_RESULT: ${{ needs.build-windows-tests.result }}
          CARGO_CLIPPY_RESULT: ${{ needs.cargo-clippy.result }}
          CARGO_FMT_RESULT: ${{ needs.cargo-fmt.result }}
          CARGO_SHEAR_RESULT: ${{ needs.cargo-shear.result }}
          CARGO_TEST_RESULT: ${{ needs.cargo-test.result }}
          CARGO_TEST_WINDOWS_RESULT: ${{ needs.cargo-test-windows.result }}
          CODE_CHANGED: ${{ needs.determine_changes.outputs.code }}
          DETERMINE_CHANGES_RESULT: ${{ needs.determine_changes.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          WHEEL_SMOKE_RESULT: ${{ needs.wheel-smoke.result }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished with result '$2'"
              exit 1
            fi
          }

          require_code_validation() {
            case "$2" in
              success)
                ;;
              skipped)
                if [ "$CODE_CHANGED" != "false" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
                  echo "::error::$1 was unexpectedly skipped"
                  exit 1
                fi
                ;;
              *)
                echo "::error::$1 finished with result '$2'"
                exit 1
                ;;
            esac
          }

          require_success "determine changes" "$DETERMINE_CHANGES_RESULT"
          require_success "pre commit" "$PRE_COMMIT_RESULT"
          require_success "Build docs" "$BUILD_DOCS_RESULT"

          if [ "$CODE_CHANGED" != "true" ] && [ "$CODE_CHANGED" != "false" ]; then
            echo "::error::determine changes produced unexpected code output '$CODE_CHANGED'"
            exit 1
          fi

          require_code_validation "cargo shear" "$CARGO_SHEAR_RESULT"
          require_code_validation "cargo fmt" "$CARGO_FMT_RESULT"
          require_code_validation "cargo clippy" "$CARGO_CLIPPY_RESULT"
          require_code_validation "cargo test" "$CARGO_TEST_RESULT"
          require_code_validation "wheel smoke" "$WHEEL_SMOKE_RESULT"
          require_code_validation "build tests archive | windows" "$BUILD_WINDOWS_TESTS_RESULT"
          require_code_validation "cargo test | windows" "$CARGO_TEST_WINDOWS_RESULT"
