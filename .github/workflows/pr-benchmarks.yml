name: PR Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/pr-benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "pyproject.toml"
      - "python/**"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BENCHMARK_PYTHON_VERSION: "3.13"

jobs:
  benchmark-tools:
    name: "build benchmark tools"

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: "Install Rust toolchain"
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: ${{ env.BENCHMARK_PYTHON_VERSION }}

      - name: Build benchmark runner
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo build -p karva_benchmark --bin karva-benchmark --release

      - name: Generate project matrix
        id: projects
        run: |
          matrix=$(target/release/karva-benchmark list-projects)
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Upload benchmark runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-tools
          path: target/release/karva-benchmark

  build-wheels:
    name: "build benchmark wheels"

    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      base_short: ${{ steps.wheels.outputs.base_short }}
      head_short: ${{ steps.wheels.outputs.head_short }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: "Install Rust toolchain"
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: ${{ env.BENCHMARK_PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.BENCHMARK_PYTHON_VERSION }}

      - name: Build comparison wheels
        id: wheels
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail

          git remote add base "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url base "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 base "${BASE_SHA}"

          base_worktree="${RUNNER_TEMP}/karva-base"
          base_wheel_dir="${RUNNER_TEMP}/karva-wheels/base"
          head_wheel_dir="${RUNNER_TEMP}/karva-wheels/head"
          artifact_dir="${RUNNER_TEMP}/benchmark-wheels"

          git worktree add --detach "${base_worktree}" "${BASE_SHA}"
          (
            cd "${base_worktree}"
            uv run --no-project --with maturin maturin build --release --out "${base_wheel_dir}"
          )
          uv run --no-project --with maturin maturin build --release --out "${head_wheel_dir}"

          base_wheel=$(find "${base_wheel_dir}" -maxdepth 1 -name "karva-*.whl" -print -quit)
          head_wheel=$(find "${head_wheel_dir}" -maxdepth 1 -name "karva-*.whl" -print -quit)

          if [[ -z "${base_wheel}" || -z "${head_wheel}" ]]; then
            echo "Failed to find both benchmark wheels" >&2
            exit 1
          fi

          mkdir -p "${artifact_dir}/base" "${artifact_dir}/head"
          cp "${base_wheel}" "${artifact_dir}/base/"
          cp "${head_wheel}" "${artifact_dir}/head/"

          {
            echo "base_short=${BASE_SHA::7}"
            echo "head_short=${HEAD_SHA::7}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload benchmark wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-wheels
          path: ${{ runner.temp }}/benchmark-wheels

  compare-benchmarks:
    name: "compare benchmarks (${{ matrix.project }})"

    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs:
      - benchmark-tools
      - build-wheels

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.benchmark-tools.outputs.matrix) }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: ${{ env.BENCHMARK_PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: ""
          ignore-empty-workdir: true
          python-version: ${{ env.BENCHMARK_PYTHON_VERSION }}

      - name: Download benchmark runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-tools
          path: ${{ runner.temp }}/benchmark-tools

      - name: Download benchmark wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-wheels
          path: ${{ runner.temp }}/benchmark-wheels

      - name: Compare wall-time and memory benchmarks
        env:
          BASE_LABEL: main (${{ needs.build-wheels.outputs.base_short }})
          HEAD_LABEL: PR (${{ needs.build-wheels.outputs.head_short }})
          ITERATIONS: ${{ matrix.iterations }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail

          base_wheel=$(find "${RUNNER_TEMP}/benchmark-wheels/base" -maxdepth 1 -name "karva-*.whl" -print -quit)
          head_wheel=$(find "${RUNNER_TEMP}/benchmark-wheels/head" -maxdepth 1 -name "karva-*.whl" -print -quit)
          report_dir="${RUNNER_TEMP}/benchmark-reports"
          memory_report_dir="${RUNNER_TEMP}/benchmark-memory-reports"
          mkdir -p "${report_dir}" "${memory_report_dir}"
          chmod +x "${RUNNER_TEMP}/benchmark-tools/karva-benchmark"

          "${RUNNER_TEMP}/benchmark-tools/karva-benchmark" compare \
            --baseline-label "${BASE_LABEL}" \
            --baseline-wheel "${base_wheel}" \
            --candidate-label "${HEAD_LABEL}" \
            --candidate-wheel "${head_wheel}" \
            --iterations "${ITERATIONS}" \
            --project "${PROJECT}" \
            --output-wall-time-json "${report_dir}/${PROJECT}.json" \
            --output-wall-time-markdown "${report_dir}/${PROJECT}.md" \
            --output-memory-json "${memory_report_dir}/${PROJECT}.json" \
            --output-memory-markdown "${memory_report_dir}/${PROJECT}.md"

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report-${{ matrix.project }}
          path: ${{ runner.temp }}/benchmark-reports/${{ matrix.project }}.json

      - name: Upload memory benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-memory-report-${{ matrix.project }}
          path: ${{ runner.temp }}/benchmark-memory-reports/${{ matrix.project }}.json

  comment:
    name: "comment benchmark report"

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    needs:
      - compare-benchmarks

    if: ${{ needs.compare-benchmarks.result == 'success' }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BENCHMARK_PYTHON_VERSION }}

      - name: Download benchmark runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-tools
          path: ${{ runner.temp }}/benchmark-tools

      - name: Download benchmark reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/benchmark-reports

      - name: Download memory benchmark reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-memory-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/benchmark-memory-reports

      - name: Merge benchmark reports
        run: |
          chmod +x "${RUNNER_TEMP}/benchmark-tools/karva-benchmark"
          "${RUNNER_TEMP}/benchmark-tools/karva-benchmark" merge-reports \
            --input-dir "${RUNNER_TEMP}/benchmark-reports" \
            --output-markdown "${RUNNER_TEMP}/benchmark-report.md" \
            --output-html "${RUNNER_TEMP}/benchmark-report.html" \
            --output-diagnostics-markdown "${RUNNER_TEMP}/diagnostic-report.md" \
            --output-diagnostics-summary-markdown "${RUNNER_TEMP}/diagnostic-summary.md" \
            --output-diagnostics-html "${RUNNER_TEMP}/diagnostic-report.html"

      - name: Merge memory benchmark reports
        run: |
          "${RUNNER_TEMP}/benchmark-tools/karva-benchmark" merge-reports \
            --input-dir "${RUNNER_TEMP}/benchmark-memory-reports" \
            --output-markdown "${RUNNER_TEMP}/benchmark-memory-report.md" \
            --output-html "${RUNNER_TEMP}/benchmark-memory-report.html"

      - name: Publish benchmark summary
        run: |
          cat \
            "${RUNNER_TEMP}/benchmark-report.md" \
            "${RUNNER_TEMP}/benchmark-memory-report.md" \
            "${RUNNER_TEMP}/diagnostic-summary.md" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload full benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: |
            ${{ runner.temp }}/benchmark-report.html
            ${{ runner.temp }}/benchmark-report.md
            ${{ runner.temp }}/benchmark-memory-report.html
            ${{ runner.temp }}/benchmark-memory-report.md
            ${{ runner.temp }}/diagnostic-report.html
            ${{ runner.temp }}/diagnostic-report.md

      - name: Comment benchmark reports
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          comment_report() {
            local marker="$1"
            local report_path="$2"
            local payload_path="$3"
            local comment_id
            local max_length=65536 # GitHub issue-comment body limit reported by issue #1106.
            local truncation_notice

            truncation_notice=$(cat <<EOF


          > [!NOTE]
          > Report truncated to fit GitHub's comment limit. [View the complete summary online](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) or [download the full report artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts).
          EOF
            )

            comment_id=$(
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
                | tail -n 1
            )

            jq -n \
              --rawfile body "${report_path}" \
              --arg notice "${truncation_notice}" \
              --argjson max_length "${max_length}" \
              '{body: (if ($body | length) > $max_length then $body[:$max_length - ($notice | length)] + $notice else $body end)}' \
              > "${payload_path}"

            if [[ -n "${comment_id}" ]]; then
              gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --input "${payload_path}"
            else
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --input "${payload_path}"
            fi
          }

          comment_report \
            "<!-- karva-benchmark-comparison -->" \
            "${RUNNER_TEMP}/benchmark-report.md" \
            "${RUNNER_TEMP}/benchmark-comment.json"
          comment_report \
            "<!-- karva-memory-benchmark-comparison -->" \
            "${RUNNER_TEMP}/benchmark-memory-report.md" \
            "${RUNNER_TEMP}/benchmark-memory-comment.json"
          comment_report \
            "<!-- karva-diagnostic-comparison -->" \
            "${RUNNER_TEMP}/diagnostic-summary.md" \
            "${RUNNER_TEMP}/diagnostic-comment.json"
