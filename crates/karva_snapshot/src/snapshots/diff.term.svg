<svg width="740px" height="74px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-cyan { fill: #00AAAA }
    .fg-green { fill: #00AA00 }
    .fg-red { fill: #AA0000 }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    .underline { text-decoration-line: underline; }
    .dimmed { opacity: 0.4; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan class="fg-cyan dimmed">1</tspan><tspan> │ </tspan><tspan class="fg-red">-</tspan><tspan class="fg-red underline">second</tspan>
</tspan>
    <tspan x="10px" y="46px"><tspan class="fg-cyan bold dimmed">1</tspan><tspan> │ </tspan><tspan class="fg-green">+</tspan><tspan class="fg-green underline">changed</tspan>
</tspan>
    <tspan x="10px" y="64px">
</tspan>
  </text>

</svg>
