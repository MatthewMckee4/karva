[[production]]
package = "karva"
bin = "karva"
reason = "shipped controller binary"

[[production]]
package = "karva_worker"
bin = "karva-worker"
reason = "shipped worker binary"

[[production]]
package = "karva_benchmark"
bin = "karva-benchmark"
