[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9.3,<2.0"]

[project]
name = "karva"
version = "0.0.1-alpha.13"
description = "A Python test framework, written in Rust."
authors = [{ name = "Matthew Mckee", email = "matthewmckee04@yahoo.co.uk" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.16"
keywords = ["karva", "pytest", "rust", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
karva = "karva._karva:karva_run"
karva-worker = "karva._karva:karva_worker_run"

[project.urls]
Changelog = "https://github.com/MatthewMckee4/karva/blob/main/CHANGELOG.md"
Documentation = "https://matthewmckee4.github.io/karva/"
Homepage = "https://matthewmckee4.github.io/karva/"
Issues = "https://github.com/MatthewMckee4/karva/issues"
Repository = "https://github.com/MatthewMckee4/karva"

[tool.maturin]
manifest-path = "crates/karva_python/Cargo.toml"
module-name = "karva._karva"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = ".cargo/config.toml" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.ruff]
extension = { pyi = "python" }
fix = true
target-version = "py311"

[tool.ruff.lint]
preview = true
exclude = [
    "python/karva/__main__.py",
]
select = [
    "ARG",
    "B",
    "B9",
    "D",
    "E",
    "EXE",
    "F",
    "I",
    "ISC",
    "PGH",
    "PYI",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "self-assigning-variable",
    "read-whole-file",
    "write-whole-file",
    "subprocess-run-without-check",
]
ignore = [
    "undocumented-public-module",
    # These are all enforced by, or incompatible with, the ruff formatter:
    "whitespace-before-punctuation",
    "line-too-long",
    "trailing-whitespace",
    "blank-line-with-whitespace",
    # It's often necessary to compare types instead of using isinstance()
    "type-comparison",
    "collection-literal-concatenation",
    # Let mypy/pyright complain about blanket type ignores or implicit optional
    "blanket-noqa",
    "implicit-optional",
    "S",
    "any-type",
    "docstring-in-stub",
]
unfixable = [
    # Remove the entire unused expression rather than preserving its call.
    "unused-variable",
    # Automatic fixes might obscure the underlying issue.
    "multi-value-repeated-key-literal",
    "multi-value-repeated-key-variable",
    "useless-expression",
    "subprocess-run-without-check",
    # Prefer itertools.chain.from_iterable.
    "quadratic-list-summation",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["python"]
