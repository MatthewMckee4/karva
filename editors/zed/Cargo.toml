[package]
name = "karva-zed"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate-miniz"] }
zed_extension_api = "0.7.0"

[lints.rust]
unsafe_code = "warn"

[workspace]
