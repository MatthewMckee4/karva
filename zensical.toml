[project]
site_name = "Karva"
site_url = "https://matthewmckee4.github.io/karva"
site_description = "A Python test framework, written in Rust."
site_author = "Matthew McKee"
repo_url = "https://github.com/MatthewMckee4/karva"
repo_name = "Karva"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed · fast Python testing"

docs_dir = "docs"
site_dir = "site"
dev_addr = "localhost:3000"

extra_css = ["stylesheets/extra.css"]

nav = [
    { "Home" = "index.md"},
    { "Get Started" = [
        { "Installation" = "get-started/installation.md"},
        { "Tutorial" = "get-started/tutorial.md"},
    ]},
    { "Usage" = [
        { "Overview" = "usage/index.md"},
        { "Running Tests" = [
            { "Filtering Tests" = "usage/running-tests/filtering.md"},
            { "Randomizing Test Order" = "usage/running-tests/shuffle.md"},
            { "Parallel Execution" = "usage/running-tests/parallel.md"},
            { "Watch Mode" = "usage/running-tests/watch.md"},
            { "Cache" = "usage/running-tests/cache.md"},
            { "Test Reports" = "usage/running-tests/reports.md"},
        ]},
        { "Failure Handling" = [
            { "Failing Fast" = "usage/failure-handling/fail-fast.md"},
            { "Retries" = "usage/failure-handling/retries.md"},
            { "Slow Tests" = "usage/failure-handling/slow-tests.md"},
            { "Fail Slow" = "usage/failure-handling/fail-slow.md"},
            { "Run Timeout" = "usage/failure-handling/run-timeout.md"},
        ]},
        { "Writing Tests" = [
            { "Basics" = "usage/writing-tests/tests.md"},
            { "Doctests" = "usage/writing-tests/doctests.md"},
            { "Snapshots" = "usage/writing-tests/snapshots.md"},
            { "Coverage" = "usage/writing-tests/coverage.md"},
            { "Other Functions" = "usage/writing-tests/functions.md"},
        ]},
        { "Fixtures" = [
            { "Fixtures" = "usage/fixtures/fixtures.md"},
            { "Built In" = "usage/fixtures/builtin.md"},
        ]},
        { "Tags" = [
            { "Parametrize" = "usage/tags/parametrize.md"},
            { "Skip" = "usage/tags/skip.md"},
            { "Expect Fail" = "usage/tags/expect_fail.md"},
            { "Timeout" = "usage/tags/timeout.md"},
        ]},
        { "Project Non-Goals" = "usage/non-goals.md"},
    ]},
    { "Configuration" = [
        { "Configuration" = "configuration/configuration.md"},
        { "Profiles" = "configuration/profiles.md"},
    ]},
    { "Reference" = [
        { "CLI" = "reference/cli.md"},
        { "Environment Variables" = "reference/env-vars.md"},
        { "Native Coverage Format" = "reference/native-coverage-format.md"},
    ]},
]

[project.theme]
language = "en"
logo = "assets/karva-mark.svg"
favicon = "assets/karva-mark.svg"
custom_dir = "docs/overrides"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.footer",
    "navigation.top",
    "content.action.edit",
    "content.code.copy",
    "content.tooltips",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Manrope"
code = "IBM Plex Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MatthewMckee4/karva"
name = "Karva on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/XG95vNz4Zu"
name = "Karva on Discord"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
primary = "custom"
accent = "custom"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Use dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
primary = "custom"
accent = "custom"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Use system preference"

[project.markdown_extensions.pymdownx.highlight]
linenums = true
auto_title = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
